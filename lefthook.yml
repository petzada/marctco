# Gates locais: pre-commit só nos arquivos em stage (< 10 s); pre-push só no diff do branch.
pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "*.{ts,js,mjs}"
      run: pnpm exec oxlint {staged_files}

pre-push:
  piped: true
  jobs:
    - name: 1_typecheck
      run: pnpm typecheck
    - name: 2_related
      run: node scripts/test-related.mjs
