name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # O nome "CI" é o check obrigatório da proteção da main.
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:ci
      # Build com o plugin da Cloudflare e orçamento de desempenho (< 3 MB comprimido)
      - run: pnpm build

  # Publica marct.co no Cloudflare Workers. Sem o secret CLOUDFLARE_API_TOKEN, só avisa.
  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Tabela do formulário (migrations/) no D1 antes de publicar o Worker que grava nela
      - name: Apply D1 migrations
        if: ${{ env.HAS_CLOUDFLARE_TOKEN == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        # O cf pede o ID do banco (marctco-leads), não o nome
        run: pnpm exec cf d1 migrations apply 9e73d86c-f8c6-4dee-a0de-3faf263e6834
      - name: Deploy to Cloudflare
        if: ${{ env.HAS_CLOUDFLARE_TOKEN == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # Segredos do Worker (aviso de contato no Telegram) vão junto com a versão; arquivo
        # temporário só legível pelo runner, e só com os que existirem
        run: |
          umask 077
          secrets="$RUNNER_TEMP/worker-secrets.env"
          : > "$secrets"
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [ -n "${!name}" ]; then printf '%s=%s\n' "$name" "${!name}" >> "$secrets"; fi
          done
          if [ -s "$secrets" ]; then
            pnpm exec cf deploy --message "${{ github.sha }}" --secrets-file "$secrets"
          else
            pnpm exec cf deploy --message "${{ github.sha }}"
          fi
          rm -f "$secrets"
      - name: Missing token
        if: ${{ env.HAS_CLOUDFLARE_TOKEN != 'true' }}
        run: echo "::warning::CLOUDFLARE_API_TOKEN ausente; deploy pulado."
